<!DOCTYPE html>
<html lang="{{ g.lang }}" data-theme="auto">
<head>
<script>
(function() {
  var t = localStorage.getItem('tqc-theme') || 'auto';
  document.documentElement.setAttribute('data-theme', t);
  if (t === 'dark') document.documentElement.style.colorScheme = 'dark';
  else if (t === 'light') document.documentElement.style.colorScheme = 'light';
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ _('tqc_inspection') }} — BYD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231C1C1E'/><text x='50' y='68' text-anchor='middle' font-size='52'>🔍</text></svg>">
<style>
/* ==========================================================================
   TQC Landing — Apple design language
   SF Pro typography, iOS 17 grouped list, frosted surfaces, spring motion.
   ========================================================================== */
:root {
  --bg:        #F2F2F7;
  --card:      #FFFFFF;
  --label:     #1C1C1E;
  --secondary: #6E6E73;
  --tertiary:  #AEAEB2;
  --quaternary:#C7C7CC;
  --separator: rgba(60,60,67,0.29);
  --row-active:rgba(0,0,0,0.045);
  --fill:      rgba(118,118,128,0.12);
  --blue:      #007AFF;
  --glow:      rgba(0,122,255,0.07);
  --shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
  --ease: 0.3s cubic-bezier(0.25,0.1,0.25,1);
  --spring: 0.45s cubic-bezier(0.34,1.56,0.64,1);
}
[data-theme="dark"] {
  --bg:        #000000;
  --card:      #1C1C1E;
  --label:     #F5F5F7;
  --secondary: #98989F;
  --tertiary:  #636366;
  --quaternary:#48484A;
  --separator: rgba(84,84,88,0.6);
  --row-active:rgba(255,255,255,0.06);
  --fill:      rgba(118,118,128,0.24);
  --blue:      #0A84FF;
  --glow:      rgba(10,132,255,0.12);
  --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.35);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--label);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 20px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  transition: background-color 0.4s ease, color 0.4s ease;
}

/* Ambient glow — very subtle, Apple-style depth */
body::before {
  content: "";
  position: fixed;
  inset: -20% -20% auto -20%;
  height: 70vh;
  background: radial-gradient(ellipse 60% 50% at 50% 0%, var(--glow), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.landing {
  position: relative;
  z-index: 1;
  text-align: center;
  width: 100%;
  max-width: 420px;
  animation: rise 0.55s var(--ease) both;
}

/* --- Hero ------------------------------------------------------------ */
.hero { margin-bottom: 36px; animation: rise 0.55s 0.05s var(--ease) both; }
.logo-wrap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 22px;
  margin-bottom: 26px;
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--shadow-card);
  border: 0.5px solid var(--separator);
}
.logo-wrap img { height: 36px; width: auto; display: block; }
.logo-fallback {
  display: none;
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--label);
  line-height: 1;
}
h1 {
  font-size: clamp(2rem, 8vw, 2.4rem);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.1;
  color: var(--label);
  margin-bottom: 8px;
}
.subtitle {
  font-size: 1.02rem;
  font-weight: 400;
  color: var(--secondary);
  letter-spacing: -0.01em;
}

/* --- Country list — iOS 17 grouped card ------------------------------ */
.country-group {
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
  margin-bottom: 28px;
  animation: rise 0.55s 0.12s var(--ease) both;
}
.country-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  min-height: 64px;
  text-decoration: none;
  color: var(--label);
  position: relative;
  transition: background-color 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}
.country-row + .country-row::before {
  content: "";
  position: absolute;
  top: 0; left: 64px; right: 0;
  height: 0.5px;
  background: var(--separator);
}
.country-row:active { background: var(--row-active); }
.country-row:active .country-arrow { transform: translateX(2px); }
@media (hover: hover) {
  .country-row:hover { background: var(--row-active); }
}

.flag-tile {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--fill);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.45rem;
  flex-shrink: 0;
}
.country-name {
  flex: 1;
  text-align: left;
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: -0.015em;
}
.country-arrow {
  color: var(--quaternary);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  transition: transform 0.2s var(--ease);
}
.country-arrow svg { display: block; }

/* --- Language segmented control -------------------------------------- */
.lang-row {
  display: inline-flex;
  padding: 2px;
  gap: 2px;
  background: var(--fill);
  border-radius: 10px;
  animation: rise 0.55s 0.19s var(--ease) both;
}
.lang-row a {
  padding: 6px 16px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  text-decoration: none;
  color: var(--secondary);
  transition: color 0.2s var(--ease), background-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.lang-row a.active {
  background: var(--card);
  color: var(--label);
  box-shadow: 0 1px 4px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.04);
}
.lang-row a:active { transform: scale(0.96); }

/* --- Footer ----------------------------------------------------------- */
.footer {
  margin-top: 32px;
  font-size: 0.68rem;
  letter-spacing: 0.02em;
  color: var(--tertiary);
  animation: rise 0.55s 0.26s var(--ease) both;
}

/* --- Motion ------------------------------------------------------------ */
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .landing, .hero, .country-group, .lang-row, .footer { animation: none; }
  * { transition: none !important; }
}

/* --- Focus -------------------------------------------------------------- */
a:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: 12px;
}
</style>
</head>
<body>
<div class="landing">

  <div class="hero">
    <div class="logo-wrap">
      <img src="/static/byd-logo.png" alt="BYD">
    </div>
    <h1>{{ _('tqc_inspection') }}</h1>
    <p class="subtitle">{{ _('select_country') }}</p>
  </div>

  <div class="country-group">
    {% for c in countries %}
    <a href="/?country={{ c }}&lang={{ g.lang }}" class="country-row">
      <span class="flag-tile">{{ {'Uruguay': '🇺🇾', 'Paraguay': '🇵🇾', 'Bolivia': '🇧🇴'}.get(c, '🌐') }}</span>
      <span class="country-name">{{ c }}</span>
      <span class="country-arrow" aria-hidden="true">
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
    {% endfor %}
  </div>

  <div class="lang-row" role="group" aria-label="Language">
    {% for lk, lv in langs.items() %}
    <a href="?lang={{ lk }}" class="{% if g.lang == lk %}active{% endif %}" {% if g.lang == lk %}aria-current="true"{% endif %}>{{ lv }}</a>
    {% endfor %}
  </div>

  <div class="footer">BYD Auto — TQC Inspection System</div>
</div>
</body>
</html>
